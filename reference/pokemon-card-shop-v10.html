<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>Pokémon Card Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1f2a;--panel:#252b3a;--panel2:#2f3648;--ink:#eef1f7;--mu:#98a3b8;--sign:#f2b705;--signink:#2a2000;--up:#4cc98a;--down:#ff7a6b;--line:#39415a;
 --fd:'Trebuchet MS','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
#game{max-width:900px;margin:0 auto;padding:8px 8px calc(74px + env(safe-area-inset-bottom,0px))}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sign);color:var(--signink);border-radius:10px 10px 0 0;padding:8px 12px}
#hud b{font-family:var(--fd);font-size:18px}
#hud small{display:block;font-size:12px;opacity:.8}
#money{font-family:var(--fd);font-size:22px;font-weight:800;text-align:right}
.bar{height:6px;background:#0006}
.bar i{display:block;height:100%;width:0;background:#4cc98a;transition:width .3s}
#cvw{position:relative;background:#000}
#cv{display:block;width:100%;height:auto;touch-action:manipulation}
#hint{padding:8px 12px;background:var(--panel);color:var(--mu);font-size:13px;min-height:34px}
#act{display:block;width:100%;border:0;background:var(--sign);color:var(--signink);font-family:var(--fd);font-weight:800;font-size:18px;padding:14px;border-radius:0 0 10px 10px}
#act:disabled{background:var(--panel2);color:var(--mu)}
#act.pulse{animation:pulse 1s infinite}
@media (prefers-reduced-motion:reduce){#act.pulse{animation:none}}
@keyframes pulse{50%{filter:brightness(1.18)}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;max-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 1px;font-weight:700;font-size:12px}
nav button:focus-visible,.b:focus-visible,#act:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
h2{font-family:var(--fd);margin:0 0 10px;font-size:20px}
h3{font-family:var(--fd);margin:14px 0 6px;font-size:16px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row+.row{margin-top:6px}
.mu{color:var(--mu);font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;min-height:38px}
.b:hover{border-color:var(--mu)}
.b.pri{background:var(--sign);color:var(--signink);border-color:var(--sign)}
.b.on{background:#fff;color:#111}
.b:disabled{opacity:.4;cursor:not-allowed}
.big{width:100%;margin-top:10px;font-size:16px;padding:12px}
.step{display:flex;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tiles.lg{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.sheet.wide{max-width:1000px}
.tile{position:relative;cursor:pointer;border-radius:8px}
.tile.sel{outline:3px solid var(--sign)}
.cf{position:relative;aspect-ratio:63/88;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,var(--rc),#111 130%);border:2px solid var(--rc)}
.cf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.fb{position:absolute;inset:0;padding:8px 6px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-size:11px;line-height:1.2}
.fb b{font-size:12px}.fb i{font-style:normal;opacity:.9}.fb span{opacity:.8;font-size:10px}
.rvb{position:absolute;left:0;bottom:0;background:#0009;color:#fff;font-size:9px;text-decoration:none;padding:1px 5px;border-radius:0 6px 0 0}
.pt{position:absolute;right:4px;top:4px;background:#000c;color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px}
.qt{position:absolute;left:4px;top:4px;background:var(--sign);color:var(--signink);font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px}
.ct{position:absolute;left:4px;bottom:4px;background:#2fa557;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
.fl{perspective:800px;aspect-ratio:63/88;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fl.on .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden}
.ff.front{transform:rotateY(180deg)}
.ff.back{background:radial-gradient(circle at 50% 50%,#fff 0 9%,#222 10% 14%,#e3350d 15% 45%,#c72b0a 46% 100%);border:3px solid #ffd54a}
.fl .pt{display:none}.fl.on .pt{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;padding:9px 14px;border-radius:9px;z-index:40;font-weight:600;max-width:92%}
input[type=range]{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.spark{width:84px;height:26px}
#load{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.inp{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;margin-bottom:10px}
.srow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.srow img{width:30px;height:30px;object-fit:contain;flex:none}
.tb{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px}.tb td{padding:2px 4px;border-bottom:1px solid var(--line)}.tb td+td{text-align:right}
details summary{cursor:pointer}
.tiles.lg{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.stage{display:flex;justify-content:center;padding:8px 0;cursor:pointer;perspective:900px}
.bigcard{width:min(300px,70vw);aspect-ratio:63/88;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 10px 30px #0008}
.bigcard.bk{background:radial-gradient(circle at 50% 50%,#fff 0 8%,#222 9% 12%,#e3350d 13% 44%,#c72b0a 45% 100%);border:5px solid #ffd54a}
.bigcard:not(.bk){animation:revealIn .45s ease-out}
.bigcard .cf{width:100%;height:100%;aspect-ratio:auto;border-radius:0;border:0}
.bigcard.hit{box-shadow:0 0 0 3px var(--rc),0 0 36px 8px var(--rc);animation:revealIn .45s ease-out,glow 1.1s ease-in-out .45s infinite alternate}
@keyframes revealIn{from{transform:rotateY(90deg) scale(.9);opacity:.4}to{transform:none;opacity:1}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.18)}}
@media (prefers-reduced-motion:reduce){.bigcard:not(.bk),.bigcard.hit{animation:none}}
.seqhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.seqinfo{text-align:center;min-height:24px;margin:6px 0}
/* ===== Apertura "wow" ===== */
.px{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
 background:radial-gradient(ellipse at 50% 42%,color-mix(in srgb,var(--sc) 38%,#0b0e16) 0%,#07090f 72%);
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
 --cw:min(76vw,330px,calc((100vh - 270px)*.716))}
.zv{z-index:35}
.pxbar{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px 4px;position:relative;z-index:7}
.pxbar b{font-family:var(--fd);font-size:17px}
.pxrun{font-size:13px;color:#cbd5e1}
.ib{background:#ffffff14;border:1px solid #ffffff2a;border-radius:8px;padding:6px 11px;min-height:36px;font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;padding:4px 0 2px;position:relative;z-index:7}
.dots i{width:9px;height:9px;border-radius:50%;background:#ffffff22;transition:background .3s,transform .3s}
.dots i.on{transform:scale(1.25);box-shadow:0 0 8px currentColor}
.pxstage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;perspective:1100px;position:relative}
.pxhint{min-height:104px;text-align:center;color:#cbd5e1;font-size:14px;padding:0 16px 14px;position:relative;z-index:7}
.cinfo .cv{font-family:var(--fd);font-weight:800;font-size:28px;color:#fff;margin:2px 0}
.rchip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;color:#fff;vertical-align:2px;background:var(--rc)}
.rchip.rv{background:#2b9a9a}
.nwb{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:#e3350d;color:#fff;vertical-align:2px}
/* sobre */
.packwrap{animation:packIn .6s cubic-bezier(.2,1.3,.4,1) backwards}
.packwrap.done{transition:transform .5s ease-in,opacity .5s;transform:translateY(70%) scale(.85);opacity:0}
.bobw{animation:bob 3s ease-in-out .6s infinite}
.pack{position:relative;width:calc(var(--cw)*.92);aspect-ratio:63/100;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;cursor:grab}
.pbody{position:absolute;left:0;right:0;top:12%;bottom:0;border-radius:0 0 10px 10px;overflow:hidden;
 background:linear-gradient(165deg,color-mix(in srgb,var(--sc) 80%,#fff) 0%,var(--sc) 38%,color-mix(in srgb,var(--sc) 50%,#000) 100%);box-shadow:0 26px 60px #000c}
.pbody::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5%;background:repeating-linear-gradient(90deg,#0000 0 4px,#ffffff30 4px 7px),#00000040}
.ptop{position:absolute;left:0;right:0;top:0;height:12.4%;border-radius:10px 10px 0 0;z-index:2;
 background:repeating-linear-gradient(90deg,#0000 0 4px,#ffffff33 4px 7px),linear-gradient(180deg,color-mix(in srgb,var(--sc) 65%,#fff),var(--sc));
 display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:12px;letter-spacing:.12em;color:#fff;text-shadow:0 1px 2px #0008}
.ptop.fly{transition:transform .55s cubic-bezier(.3,.7,.4,1),opacity .55s;transform:translate(45%,-230%) rotate(28deg);opacity:0}
.tear{position:absolute;left:0;top:11.6%;height:4px;width:calc(var(--tp,0)*100%);background:#fff;box-shadow:0 0 8px #fff,0 0 20px var(--sc);border-radius:2px;z-index:3;transition:opacity .2s}
.pcnt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10%;color:#fff;text-shadow:0 2px 6px #0009}
.psym{width:24%;max-height:14%;object-fit:contain;filter:drop-shadow(0 2px 4px #0008)}
.pname{font-family:var(--fd);font-weight:800;font-size:clamp(20px,6.5vw,30px);line-height:1.05;margin-top:4%}
.psub{font-size:12px;opacity:.85;margin-top:6px}
.pball{position:relative;width:34%;aspect-ratio:1;border-radius:50%;margin:6% auto;background:linear-gradient(#e3350d 0 45%,#1d1d1d 45% 55%,#f4f4f4 55%);border:4px solid #1d1d1d;box-shadow:0 4px 14px #0007}
.pball::after{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#f4f4f4;border:4px solid #1d1d1d}
.pbody .sweep{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,#ffffff55 50%,transparent 58%);animation:sweep 2.6s ease-in-out infinite;pointer-events:none}
/* cartas */
.cstack{position:relative;width:var(--cw);aspect-ratio:63/88}
.under{position:absolute;inset:0;border-radius:4.5%/3.2%;background:radial-gradient(ellipse at 50% 45%,#3f74d6,#10317a);border:6px solid #163f97;transform:translate(calc(var(--i)*6px),calc(var(--i)*6px));transition:opacity .3s;box-shadow:0 10px 25px #0008}
.under.off{opacity:0}
.pc{position:absolute;inset:0;transform:translate(var(--dx,0px),0) rotate(var(--dr,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;will-change:transform;cursor:pointer}
.pc.snap{transition:transform .25s}
.pc.fly{transition:transform .42s cubic-bezier(.4,0,.8,.6),opacity .42s;opacity:0;pointer-events:none}
.ent{position:absolute;inset:0;transform-style:preserve-3d;animation:cardIn .38s cubic-bezier(.2,1.25,.4,1) backwards}
.wob{position:absolute;inset:0;transform-style:preserve-3d}
.pc.l3 .wob{animation:shake .16s linear infinite}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.25,.5,1)}
.pc.back .inner{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;border-radius:4.5%/3.2%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px #000b}
.fr .cf{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
.fr .fb{font-size:14px;padding:14px 12px}.fr .fb b{font-size:18px}
.bk{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;
 background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff0d 0 8deg,transparent 8deg 16deg),radial-gradient(ellipse at 50% 45%,#4f86e8 0%,#2156b8 45%,#10317a 100%);border:8px solid #163f97}
.bk .pball{width:40%;margin:0}
.pc.charge .bk{animation:charge .7s ease-in-out infinite alternate}
.holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--ho,0);
 background:repeating-linear-gradient(115deg,#ff0080 0%,#ffbf00 6%,#39ff14 12%,#00e5ff 18%,#7b2cff 24%,#ff0080 30%);
 background-size:300% 300%;background-position:var(--mx,50%) var(--my,50%);filter:brightness(.75) contrast(1.35)}
.holo.gold{background-image:repeating-linear-gradient(115deg,#fff2a8 0%,#d4a017 7%,#fff 14%,#b8860b 21%,#fff2a8 28%)}
.holo.sp::after{content:"";position:absolute;inset:0;mix-blend-mode:overlay;opacity:.9;
 background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#fff 1.2px,transparent 1.8px);background-size:23px 23px,41px 41px;
 background-position:calc(var(--mx,50%)*.4) calc(var(--my,50%)*.4),calc(var(--mx,50%)*-.3) calc(var(--my,50%)*.2)}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.6),rgba(255,255,255,0) 55%)}
.rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;pointer-events:none;opacity:0;transition:opacity .5s;
 background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc,#fff) 50%,transparent) 0 9deg,transparent 9deg 18deg);
 -webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spin 24s linear infinite}
.rays.on{opacity:.9}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.flash.on{animation:flash .55s ease-out}
.banner{position:absolute;top:3%;left:50%;z-index:5;transform:translateX(-50%);padding:8px 18px;border-radius:999px;background:var(--rc);color:#fff;font-family:var(--fd);font-weight:800;font-size:18px;box-shadow:0 6px 24px #000a,0 0 0 2px #fff6 inset;white-space:nowrap;animation:bannerIn .5s cubic-bezier(.2,1.6,.4,1) backwards}
.conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.tile.best{outline:3px solid var(--sign);box-shadow:0 0 18px #f2b70588}
.nw{position:absolute;right:4px;bottom:4px;background:#e3350d;color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px}
.zoomable{cursor:zoom-in}
@keyframes packIn{from{transform:translateY(80px) scale(.8);opacity:0}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes sweep{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
@keyframes cardIn{from{transform:translateY(34px) scale(.92);opacity:0}}
@keyframes shake{25%{transform:translate(-2px,1px) rotate(-.7deg)}75%{transform:translate(2px,-1px) rotate(.7deg)}}
@keyframes charge{from{box-shadow:0 0 0 2px var(--rc),0 0 18px 4px var(--rc)}to{box-shadow:0 0 0 4px var(--rc),0 0 55px 18px var(--rc)}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes flash{from{opacity:.85}to{opacity:0}}
@keyframes bannerIn{from{transform:translateX(-50%) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.bobw,.pbody .sweep,.pc.l3 .wob,.pc.charge .bk,.rays{animation:none}.ent,.packwrap{animation:none}}
/* ===== v5 ===== */
#hud .hr{display:flex;align-items:center;gap:10px}
.hb{background:#0002;border:1px solid #0003;border-radius:9px;min-width:40px;min-height:40px;font-size:18px}
#cvw{position:relative;background:#0b0e14;aspect-ratio:800/560;overflow:hidden}
@media (max-aspect-ratio:1/1){#cvw{aspect-ratio:auto;height:min(56vh,620px)}}
#cv{display:block;width:100%;height:100%;touch-action:none}
.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zb button{width:38px;height:38px;border-radius:10px;border:1px solid #fff3;background:#000a;color:#fff;font-size:18px;font-weight:700}
nav button{position:relative}
nav button.bdg::after{content:"";position:absolute;top:5px;right:8px;width:9px;height:9px;border-radius:50%;background:#e3350d;box-shadow:0 0 0 2px var(--panel)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);bottom:auto;z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
#toast .toast{position:static;transform:none;max-width:100%;box-shadow:0 6px 18px #0007;text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs .b{flex:1;padding:8px 4px}
.prog{height:8px;border-radius:5px;background:#0006;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,#4cc98a,#f2b705)}
.tiles.alb{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.tiles.alb .fb{font-size:9px;padding:4px}.tiles.alb .fb b{font-size:9px}
.tile.miss .cf{filter:grayscale(1) brightness(.45);opacity:.45}
.tile .num{position:absolute;left:3px;top:3px;background:#000b;color:#fff;font-size:10px;padding:0 4px;border-radius:4px}
.gb{position:absolute;right:4px;bottom:4px;background:#fff;color:#c0392b;font-size:10px;font-weight:900;padding:1px 5px;border-radius:5px;border:1px solid #c0392b}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu .b{min-height:62px;font-size:15px}
.ckwrap{display:flex;flex-direction:column;gap:10px}
.cust{display:flex;gap:10px;align-items:center}.cust .av{font-size:36px}
.cust .sp{background:#fff;color:#111;border-radius:12px;padding:8px 12px;font-weight:600}
.lcd{background:#0d2b1b;color:#7fe3a0;font-family:ui-monospace,Menlo,Consolas,monospace;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;box-shadow:inset 0 2px 8px #000a;border:2px solid #1d3d2a}
.lcd b{font-size:28px}
.ckitems{font-size:13px;color:var(--mu)}
.chg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chg .pn{margin:0;text-align:center}.chg b{font-family:var(--fd);font-size:22px;display:block}
.tray{min-height:48px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:#0003;border:1px dashed var(--line);border-radius:10px;padding:6px}
.drawer{background:linear-gradient(#3a3f4b,#2a2e38);border-radius:12px;padding:10px;display:grid;gap:8px;border:2px solid #555c6b}
.drow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:center}
.bill{border:0;border-radius:6px;height:46px;font-weight:800;color:#fff;text-shadow:0 1px 2px #0008;font-size:15px;position:relative;box-shadow:0 2px 0 #0006;display:flex;align-items:center;justify-content:center;padding:0 6px}

function cacheGet(api){return IDB.get("set:"+api).then(v=>v||cget("pcs-set2-"+api)||cget("pcs-set-"+api))}
function fetchSetCards(sd,force){
  return cacheGet(sd.api).then(c=>{
    const has=c&&c.cards&&c.cards.length;
    if(has&&!force&&Date.now()-c.t<18*36e5){FAILED.delete(sd.id);return c.cards}
    const q=n=>API+"cards?q=set.id:"+sd.api+"&pageSize=250&page="+n+"&select=id,name,number,rarity,images,cardmarket";
    const get=(url,att)=>jget(url,40000).catch(e=>att<2?new Promise(r=>setTimeout(r,1500*(att+1)+rnd(800))).then(()=>get(url,att+1)):Promise.reject(e));
    return get(q(1),0).then(j=>{
      const pages=Math.ceil((j.totalCount||j.data.length)/250);let all=j.data;if(pages<=1)return all;
      const more=[];for(let n=2;n<=pages;n++)more.push(get(q(n),0).then(x=>x.data));
      return Promise.all(more).then(arr=>all.concat(...arr));
    }).then(data=>{
      const cards=data.filter(d=>d&&d.id).map(d=>mapCard(d,sd));
      if(!cards.length)throw 0;
      const rec={t:Date.now(),cards};
      IDB.put("set:"+sd.api,rec).then(ok=>{if(ok==null)cput("pcs-set2-"+sd.api,rec);else try{localStorage.removeItem("pcs-set-"+sd.api);localStorage.removeItem("pcs-set2-"+sd.api)}catch(e){}});
      FAILED.delete(sd.id);STALE.delete(sd.id);return cards;
    }).catch(()=>{if(has){STALE.add(sd.id);FAILED.delete(sd.id);return c.cards}FAILED.add(sd.id);return []});
  });
}
function loadMany(ids,onp){
  let i=0,done=0;const out=[];
  const work=()=>{if(i>=ids.length)return Promise.resolve();const id=ids[i++],sd=SETDEF.find(d=>d.id===id);if(!sd)return work();
    return fetchSetCards(sd).then(cs=>{cs.forEach(c=>c.s=sd.id);out.push(...cs);done++;if(onp)onp(done,ids.length,sd)}).then(work)};
  return Promise.all([work(),work(),work()]).then(()=>out);
}

function step(p,vol){

  p.p=Math.max(.02,p.p*Math.exp(p.t+gauss()*.03*vol)+(p.b-p.p)*.03);

}

  else{const p={p:c.b*(.92+Math.random()*.16),t:0,b:c.b,h:[]};for(let i=0;i<30;i++)step(p,VOL[c.r]);return p}

}

const VIEW={s:1,ox:0,oy:0,cw:W,ch:H,dpr:2,min:1,max:2,cover:1,init:false,user:0};
function clampView(){const V=VIEW,x0=CX0*V.s,x1=CX1*V.s,y0=CY0*V.s,y1=CY1*V.s;
  V.ox=x1-x0<=V.cw?(V.cw-(x1+x0))/2:clamp(V.ox,V.cw-x1,-x0);V.oy=y1-y0<=V.ch?(V.ch-(y1+y0))/2:clamp(V.oy,V.ch-y1,-y0)}
function fitCanvas(){
  const r=CV.getBoundingClientRect();if(!r.width||!r.height)return;const V=VIEW,dpr=Math.min(2,devicePixelRatio||1);
  const cx0=V.init?(V.cw/2-V.ox)/V.s:W/2,cy0=V.init?(V.ch/2-V.oy)/V.s:H*.45;
  CV.width=Math.round(r.width*dpr);CV.height=Math.round(r.height*dpr);
  V.cw=r.width;V.ch=r.height;V.dpr=dpr;V.min=Math.min(r.width/(CX1-CX0),r.height/(CY1-CY0));V.shop=Math.min(r.width/W,r.height/H);V.cover=Math.max(r.width/W,r.height/(FRONT_Y+40));V.max=Math.max(V.cover*2.2,V.shop*2.5);
  if(!V.init){V.s=V.cover;V.init=true}

function rarOf(d){
  const r=d.rarity;if(RMAP[r])return RMAP[r];if(!r)return "R";
  if(/secret|rainbow|hyper|gold|black white/i.test(r))return "HR";if(/special illustration/i.test(r))return "SIR";if(/illustration|radiant|amazing|gallery/i.test(r))return "IR";

}

function addSets(ids){
  ids=ids.filter(id=>!S.sets.includes(id)&&SETDEF.some(d=>d.id===id));if(!ids.length){toast("Ya están todas en tu catálogo");return Promise.resolve()}
  if(MODE!=="real"){toast("Sin conexión con la API: no se pueden añadir sets");return Promise.resolve()}
  let done=0,ok=0;const q=ids.slice();toast(`Cargando ${ids.length} colección(es)…`);
  const work=()=>{const id=q.shift();if(!id)return Promise.resolve();const sd=SETDEF.find(x=>x.id===id);
    return fetchSetCards(sd).then(cs=>{done++;if(cs.length){cs.forEach(c=>c.s=sd.id);CARDS=CARDS.filter(c=>c.s!==sd.id).concat(cs);S.sets.push(sd.id);ok++}if(ids.length>2&&done%3===0)toast(`Cargando… ${done}/${ids.length}`)}).then(work)};

}

  sellall:()=>{let t=0,nf=0;const ids=new Set(grpItems().filter(i=>!i.res&&!i.gq).map(i=>i.i));S.items=S.items.filter(i=>{if(ids.has(i.i)){if(i.fk)nf++;else t+=itemVal(i)*.85;return false}return true});S.money+=t;if(nf)toast(`🚫 ${nf} eran falsas: el mayorista no las paga`);collSel=null;hud();renderM()},
  caseadd:()=>{if(caseItems().length>=caseCap())return;const it=grpItems().find(i=>i.case==null&&!i.gq&&!i.fkK);if(!it)return;const inc=grpItems().find(i=>i.case!=null);it.case=inc?inc.case:1.1;renderM()},
  caserem:()=>{const it=grpItems().find(i=>i.case!=null&&!i.res&&!i.lux);if(it)it.case=null;renderM()},
  mk:d=>{grpItems().forEach(i=>{if(i.case!=null)i.case=clamp(Math.round((i.case+ +d.n)*100)/100,.6,1.6)});renderM()},
  upg:d=>{const u=UPS.find(x=>x.k===d.k),c=u.cost[S.up[d.k]];if(S.money<c)return;S.money-=c;S.up[d.k]++;assignSlots();hud();renderM()},
  dealask:()=>finishDeal(deal.ask),
  dealcounter:()=>finishDeal(deal.counter),
  dealno:()=>closeDeal(deal.cust,false),
  dealoffer:()=>{
    const d=deal,o=+($("[data-i=offer]").value);d.offer=o;
    if(o>=d.ask){finishDeal(d.ask);return}
    if(o>=d.floor){finishDeal(o);return}
    if(o>=d.floor*.85){d.counter=r05(d.floor);d.msg=`Mmm… por ${fmt(d.counter)} y cerramos.`;renderM();return}
    d.tries++;d.counter=0;
    if(d.tries>=2){say(d.cust,"😠");closeDeal(d.cust,true);return}
    d.msg="¡Eso es casi un insulto! Ofréceme algo razonable.";renderM();
  }
};
const I={hgx:el=>{HG.x=+el.value;$("#hglab").textContent=fmt(HG.x)},lotx:el=>{LOT.offer=+el.value;$("#lotlab").textContent=fmt(LOT.offer)},setq:el=>{setQ=el.value;const e=$("#setlist");if(e)e.innerHTML=setRows()},offer:el=>{deal.offer=+el.value;$("#olab").textContent=fmt(+el.value)}};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  if(b.classList.contains("ov")&&e.target!==b)return;
  const f=A[b.dataset.a];if(f)f(b.dataset,b);
});
document.addEventListener("input",e=>{const b=e.target.closest("[data-i]");if(b&&I[b.dataset.i])I[b.dataset.i](b)});

/* ===================== BUCLE ===================== */
let last=performance.now(),hudT=0,saveT=0;
function frame(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;
  if(S&&!M&&!paused){
    const dt=raw*speed;updFx(dt);updPfx(dt);updPed(dt);updCars(dt);
    if(S.phase==="open"||S.phase==="closing"){
      if(S.phase==="open"){
        S.clock+=dt;spawnT-=dt;
        if(spawnT<=0){
          spawn();
          if(S.burst>0){S.burst--;spawnT=.8}
          else{const base=5.5/(1+repv()*.03)/(1+S.up.ads*.3)/spMul();spawnT=base*(.6+Math.random()*.8)}
        }
        if(S.clock>=DAYLEN)S.phase="closing";
      }
      updateCusts(dt);
      if(S.phase==="closing"&&!custs.some(c=>c.st!=="leave"||c.y<FRONT_Y+6)){if(!VIS.endAt){VIS.endAt=performance.now()+1400;sfx.shutter()}else if(performance.now()>VIS.endAt){VIS.endAt=0;endDay()}}
    }else updateCusts(dt);
    hudT+=raw;saveT+=raw;
    if(hudT>.25){hudT=0;hud()}
    if(saveT>10){saveT=0;saveNow()}
    camFollow(raw);updCat(dt);
  }
  if(S&&VIS.mShown!=null&&Math.abs(S.money-VIS.mShown)>.004){const d=S.money-VIS.mShown;VIS.mShown=Math.abs(d)<.02?S.money:VIS.mShown+d*Math.min(1,raw*7);const el=$("#money");if(el&&el.firstChild){el.firstChild.nodeValue=fmt(VIS.mShown);if(d>.5&&!el.classList.contains("gain")){el.classList.add("gain");setTimeout(()=>el.classList.remove("gain"),520)}}}
  if(S)draw();
  if(S)tutTick();
  requestAnimationFrame(frame);
}
window.addEventListener("beforeunload",()=>{if(S)saveNow()});
$("#impfile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(r.result);r.readAsText(f);e.target.value=""});
document.addEventListener("keydown",e=>{if((e.code==="Space"||e.key==="p")&&!M&&S&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();setPause(!paused)}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S&&S.phase!=="closed"&&!paused)setPause(true)});

/* ===================== ARRANQUE ===================== */
(function boot(){
  const txt=$("#loadtxt");
  let ids=DEFAULT_SETS;
  const sv=cget("pcs-save-real-v3")||cget("pcs-save-real-v2");
  if(sv&&sv.sets&&sv.sets.length)ids=sv.sets;
  loadSetList().then(list=>{
    if(list)list.forEach(mkSetDef);
    ids=ids.filter(i=>SETDEF.some(d=>d.id===i));if(!ids.length)ids=DEFAULT_SETS;
    txt.textContent="Cargando "+ids.length+" colecciones con precios de Cardmarket…";
    return loadMany(ids,(d,n,sd)=>{txt.textContent=`Cargando colecciones ${d}/${n} · ${sd.n}…`});
  }).then(all=>{
    if(all.length<100)throw 0;
    CARDS=all;MODE="real";NOTE=FAILED.size?`⚠️ ${FAILED.size} colección(es) sin cargar: Más → Colecciones → Reintentar`:"Precios reales de Cardmarket";
  }).catch(()=>{
    if(cget("pcs-save-real-v3"))return new Promise(res=>{$("#load").innerHTML=`<div><h2>No se pudieron cargar las cartas</h2><p class="mu">La API de cartas no responde ahora mismo. Tu partida está guardada y no se pierde.</p><div class="btns" style="justify-content:center"><button class="b pri" id="lretry">Reintentar</button><button class="b" id="loff">Jugar sin conexión (partida aparte)</button></div></div>`;$("#lretry").onclick=()=>location.reload();$("#loff").onclick=()=>{CARDS=offlineCards();MODE="offline";NOTE="Sin conexión: partida aparte con cartas ilustradas";res()}});
    CARDS=offlineCards();MODE="offline";NOTE="Sin conexión con la API: cartas ilustradas y precios simulados";
  })
  .then(()=>{indexCards();loadOrNew();$("#load").remove();paintNav();fitCanvas();setMusic(MUSIC);hud();requestAnimationFrame(frame);if(FAILED.size)setTimeout(()=>toast(`⚠️ ${FAILED.size} colección(es) no cargaron. Reinténtalo en Más → Colecciones`),800)});
})();
</script>
