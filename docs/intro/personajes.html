    ctx.fillStyle="rgba(60,50,45,.25)";for(let i=0;i<90;i++){const a=Math.PI*(.08+.84*((i*37)%100)/100),r=.8+.2*((i*53)%10)/10;ctx.fillRect(cx+Math.cos(a)*rx*r*.95-1,cy+12+Math.sin(a)*ry*r*.82,1.6,1.6)}}
  // pelo delantero

    ctx.fillStyle=ch.hair;P(()=>{ctx.moveTo(150,62);ctx.quadraticCurveTo(110,70,70,112);ctx.quadraticCurveTo(110,104,160,96);ctx.closePath()});ctx.fill();

    ctx.strokeStyle=ch.hairS;ctx.lineWidth=2;[[106,62,176,104],[94,64,64,104],[92,74,60,122]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.quadraticCurveTo((a+c)/2,Math.min(b,d)-8,c,d);ctx.stroke()})}

    ctx.strokeStyle=ch.hairH;ctx.lineWidth=2.5;[[118,60,82,94],[122,60,160,92],[100,62,70,108],[140,62,172,110]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.quadraticCurveTo((a+c)/2,(b+d)/2-8,c,d);ctx.stroke()});

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function star(ctx,x,y,r,c){ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.strokeStyle="rgba(150,90,0,.6)";ctx.lineWidth=1.5;ctx.stroke()}
/* muñeco pequeño para la tienda */
function drawMini(ctx,ch,x,y,ph){
  const b=Math.sin(ph||0)*1.5,sc=ch.kid?.85:1;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(0,0,14,5,0,0,7);ctx.fill();
  if(ch.style==="back"){ctx.save();ctx.translate(0,-62+b);ctx.scale(.24,.24);ctx.translate(-120,-140);drawPortrait(ctx,Object.assign({},ch,{onlyBack:true}),"happy",240);ctx.restore()}
  ctx.fillStyle="#2c3350";ctx.fillRect(-8,-20,7,20);ctx.fillRect(1,-20,7,20);ctx.fillStyle="#222";ctx.fillRect(-9,-3,8,4);ctx.fillRect(1,-3,8,4);
  ctx.fillStyle=ch.vest||ch.shirt;rrect(ctx,-12,-46+b,24,28,6);ctx.fill();if(ch.vest){ctx.fillStyle=ch.shirt;ctx.fillRect(-3,-45+b,6,26)}
  ctx.fillStyle=ch.skin;ctx.beginPath();ctx.arc(-14,-30+b,4,0,7);ctx.arc(14,-30+b,4,0,7);ctx.fill();
  if(ch.ball){const by=-33+b;ctx.fillStyle="#e3350d";ctx.beginPath();ctx.arc(0,by,4.5,Math.PI,0);ctx.fill();ctx.fillStyle="#f4f4f4";ctx.beginPath();ctx.arc(0,by,4.5,0,Math.PI);ctx.fill();ctx.fillStyle="#1b1b1b";ctx.fillRect(-4.5,by-.7,9,1.4);ctx.beginPath();ctx.arc(0,by,1.6,0,7);ctx.fill()}
  ctx.save();ctx.translate(0,-62+b);const k=.24;ctx.scale(k,k);ctx.translate(-120,-140);drawPortrait(ctx,Object.assign({},ch,{print:null,ball:false,vest:null,noBack:true,shirt:"rgba(0,0,0,0)",shirtS:"rgba(0,0,0,0)"}),"happy",240);ctx.restore();
  ctx.restore();
}

const cards=document.getElementById("cards"),dpr=Math.min(2,devicePixelRatio||1);
function cv(w,h){const c=document.createElement("canvas");c.width=w*dpr;c.height=h*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);return [c,x]}
["emma","alvaro","alberto"].forEach(k=>{const ch=CHARS[k],card=document.createElement("div");card.className="card";
  const [big,bx]=cv(240,300);big.className="big";drawPortrait(bx,ch,"happy",240);
  card.innerHTML=`<div class="top"><div class="bigh"></div><div><h2>${ch.n}</h2><div class="role">${ch.role}</div><ul>${ch.traits.map(t=>`<li>${t}</li>`).join("")}</ul></div></div><div class="ex"></div>`;
  card.querySelector(".bigh").appendChild(big);const ex=card.querySelector(".ex");
  EXPR.forEach(([e,n])=>{const f=document.createElement("figure"),[c,x]=cv(240,300);drawPortrait(x,ch,e,240);f.appendChild(c);const cap=document.createElement("figcaption");cap.textContent=n;f.appendChild(cap);ex.appendChild(f)});
  cards.appendChild(card)});
/* escena de ejemplo */
(function(){const c=document.getElementById("scene"),x=c.getContext("2d"),W=900,H=520;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#2a3350");g.addColorStop(1,"#141824");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle="#3b2a1f";x.fillRect(0,330,W,190);x.fillStyle="#6b4527";for(let i=0;i<W;i+=60)x.fillRect(i,330,30,190);
  x.fillStyle="rgba(255,220,150,.15)";x.beginPath();x.arc(450,120,260,0,7);x.fill();
  x.save();x.translate(70,40);drawPortrait(x,CHARS.alberto,"laugh",290);x.restore();
  x.save();x.translate(560,50);drawPortrait(x,CHARS.alvaro,"wow",270);x.restore();
  x.fillStyle="#000";x.fillRect(0,0,W,46);x.fillRect(0,H-46,W,46);
  x.fillStyle="#fff";rrect(x,150,350,600,112,22);x.fill();x.beginPath();x.moveTo(230,350);x.lineTo(205,318);x.lineTo(275,350);x.fill();
  x.fillStyle="#e3350d";x.font="700 22px Fredoka,sans-serif";x.fillText("PAPÁ ALBERTO",176,384);
  x.fillStyle="#1d1a15";x.font="600 24px Fredoka,sans-serif";x.fillText("Chicos, me jubilo. Me voy al gimnasio…",176,418);x.fillText("¡a tiempo completo! 💪",176,448);
  x.fillStyle="#fff";x.font="700 18px Fredoka,sans-serif";x.fillText("Toca para seguir ▸",W-200,H-16);x.fillText("Saltar ⏭",20,30);
})();
/* tienda */
(function(){const c=document.getElementById("shop"),x=c.getContext("2d"),W=900,H=260;x.fillStyle="#d9a066";x.fillRect(0,0,W,H);
  x.strokeStyle="rgba(0,0,0,.08)";for(let y=0;y<H;y+=26){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  x.fillStyle="#f2deb0";x.fillRect(0,0,W,60);x.fillStyle="#7a4b33";x.fillRect(0,56,W,6);
  let t=0;(function loop(){t+=.12;x.fillStyle="#d9a066";x.fillRect(0,62,W,H-62);x.strokeStyle="rgba(0,0,0,.08)";for(let y=78;y<H;y+=26){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
    [["emma",260],["alvaro",450],["alberto",640]].forEach(([k,px],i)=>{x.save();x.scale(1.6,1.6);drawMini(x,CHARS[k],px/1.6,210/1.6,t+i);x.restore()});requestAnimationFrame(loop)})();
})();
